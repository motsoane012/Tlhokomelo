let renderQueued = false, restoreTextFocus = false, justSeen = new Set();

/* A change event fires while the browser is still unwinding a blur. Replacing
   innerHTML at that moment throws, so re-renders from filter inputs are
   deferred to the next task. */
function scheduleRender(){
  if (renderQueued) return;
  renderQueued = true;
  setTimeout(() => { renderQueued = false; render(); }, 0);
}

function render(){
  const app = document.getElementById("app"), u = Session.user;
  if (!Store.state.ready){
    app.innerHTML = sb
      ? `<section class="panel"><h1>Loading Tlhokomelo…</h1><p class="sub">Fetching clinics from the server.</p></section>`
      : `<section class="panel"><h1>Can't load Tlhokomelo</h1><p class="sub">The connection library didn't load. Check your internet connection and refresh the page.</p></section>`;
    renderNav(); return;
  }

  if (PROTECTED[route]){
    if (!u) route = "/login";
    else if (u.role !== PROTECTED[route]) route = homeRoute();
  }
  if (route === "/app") route = u ? homeRoute() : "/login";

  justSeen = (u && ((route === "/requests" && u.role === "provider") ||
                    (route === "/visits" && u.role === "patient")))
    ? markSeen(u) : new Set();

  const roleMatch = route.match(/^\/register\/(patient|provider|admin)$/);
  let html, title = "Tlhokomelo";

  if (route === "/")               html = V.home();
  else if (route === "/register")  { html = V.registerChoose(); title = "Create an account — Tlhokomelo"; }
  else if (roleMatch)              { html = V.registerForm(roleMatch[1]); title = ROLES[roleMatch[1]].title; }
  else if (route === "/login")     { html = V.login(); title = "Log in — Tlhokomelo"; }
  else if (route === "/registered"){ html = V.registered(); title = "Registration received — Tlhokomelo"; }
  else if (route === "/find")      { html = V.find(filters.find); title = "Find care — Tlhokomelo"; }
  else if (route === "/visits")    { html = V.visits(); title = "My appointments — Tlhokomelo"; }
  else if (route === "/facility")  { html = V.facility(); title = "My facility — Tlhokomelo"; }
  else if (route === "/requests")  { html = V.requests(filters.requests); title = "Booking requests — Tlhokomelo"; }
  else if (route === "/directory") { html = V.directory(filters.directory); title = "Facilities — Tlhokomelo"; }
  else if (route === "/accounts")  { html = V.accounts(); title = "Accounts — Tlhokomelo"; }
  else                             { html = V.notFound(); title = "Page not found — Tlhokomelo"; }

  liveMaps.forEach(m => { try { m.closePopup(); m.stop(); m.remove(); } catch(e){} });
  liveMaps = [];
  app.innerHTML = html;
  document.title = title;
  renderNav();
  wire(app);
  /* keep the caret in the search box when filtering as you type */
  const keep = app.querySelector("#text");
  if (keep && restoreTextFocus){
    keep.focus();
    const n = keep.value.length;
    try { keep.setSelectionRange(n, n); } catch(e){}
  } else {
    app.focus({ preventScroll:true });
  }
  restoreTextFocus = false;
}

/* A form's location fieldset: map click sets the pin, typing sets the pin,
   and the two stay in step. Keyboard users never need the map. */
/* a price box is only meaningful while its service is ticked */
function wireServicePrices(scope){
  scope.querySelectorAll('input[name="service"]').forEach(cb => {
    const price = cb.closest(".svc-row")?.querySelector(".price");
    if (!price) return;
    cb.addEventListener("change", () => {
      price.disabled = !cb.checked;
      if (!cb.checked) price.value = "";
      else price.focus();
    });
  });
}

function wirePinMap(scope, mapId, prefix){
  const el = scope.querySelector("#"+mapId);
  if (!el) return;
  const latEl = scope.querySelector("#"+prefix+"lat"), lngEl = scope.querySelector("#"+prefix+"lng");
  const start = (latEl.value && lngEl.value) ? [Number(latEl.value), Number(lngEl.value)] : null;
  const map = makeMap(el, start ? { centre:start, zoom:13 } : {});
  let marker = null;

  const place = (lat, lng, recentre) => {
    latEl.value = lat.toFixed(5); lngEl.value = lng.toFixed(5);
    if (marker) marker.setLatLng([lat,lng]);
    else marker = L.circleMarker([lat,lng], { radius:9, weight:2, color:"#12243C",
      fillColor:"#C8921B", fillOpacity:1 }).addTo(map);
    if (recentre) map.setView([lat,lng], Math.max(map.getZoom(), 13));
  };
  if (start) place(start[0], start[1], false);

  map.on("click", e => place(e.latlng.lat, e.latlng.lng, false));
  [latEl, lngEl].forEach(i => i.addEventListener("change", () => {
    const la = Number(latEl.value), ln = Number(lngEl.value);
    if (latEl.value && lngEl.value && isFinite(la) && isFinite(ln) && inLesotho(la,ln)) place(la, ln, true);
  }));
  scope.querySelector("[data-clearpin]")?.addEventListener("click", () => {
    latEl.value = ""; lngEl.value = "";
    if (marker){ map.removeLayer(marker); marker = null; }
    map.setView(LS_CENTRE, 8);
  });
}

function wire(app){
  bindForm(app.querySelector("#roleForm"), f => go("/register/"+new FormData(f).get("role")));
  bindForm(app.querySelector("#regForm"), handleRegister);
  bindForm(app.querySelector("#loginForm"), handleLogin);

  const providerMode = app.querySelector("#providerMode");
  if (providerMode){
    const toggleProviderMode = () => {
      const existing = app.querySelector("#existingProviderFields"), fresh = app.querySelector("#newProviderFields");
      if (existing) existing.hidden = providerMode.value !== "existing";
      if (fresh) fresh.hidden = providerMode.value !== "new";
    };
    providerMode.addEventListener("change", toggleProviderMode); toggleProviderMode();
  }
  app.querySelector("#demoProviderFill")?.addEventListener("click", () => {
    const id = app.querySelector("#demoProvider")?.value || "";
    const idEl = app.querySelector("#identifier"), pwEl = app.querySelector("#password");
    if (idEl) idEl.value = id;
    if (pwEl) pwEl.value = "provider123";
    idEl?.focus();
  });

  /* patient: search */
  const findForm = app.querySelector("#findForm");
  if (findForm){
    const t = findForm.querySelector("#text");
    const apply = () => {
      filters.find = Object.fromEntries(new FormData(findForm));
      restoreTextFocus = !!document.activeElement && document.activeElement.id === "text";
      scheduleRender();
    };
    findForm.querySelectorAll("select").forEach(s => s.addEventListener("change", apply));
    let typeTimer = null;
    t?.addEventListener("input", () => {           // filter as you type, debounced
      clearTimeout(typeTimer);
      typeTimer = setTimeout(apply, 250);
    });
    findForm.addEventListener("submit", e => e.preventDefault());
    t?.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); apply(); } });
    app.querySelector("#clearFilters")?.addEventListener("click", () => { filters.find = {}; scheduleRender(); });
  }
  app.querySelectorAll("[data-book]").forEach(b =>
    b.addEventListener("click", () => bookingDialog(Store.getFacility(b.dataset.book))));

  const findMapEl = app.querySelector("#findMap");
  if (findMapEl){
    const q = filters.find || {};
    const shown = Store.allFacilities().filter(f => f.status === "approved"
      && (!q.district || f.district === q.district)
      && (!q.ownership || f.ownership === q.ownership)
      && (!q.type      || f.type === q.type)
      && (!q.service  || f.services.indexOf(q.service) !== -1)
      && (!q.text     || (f.name+" "+(f.town||"")).toLowerCase().indexOf(String(q.text).toLowerCase()) !== -1));
    const map = makeMap(findMapEl);
    const marks = {};
    const addMark = f => {
      if (!(typeof f.lat === "number" && typeof f.lng === "number") || marks[f.id]) return;
      const m = facMarker(f, false).addTo(map).bindPopup(facPopupHtml(f));
      marks[f.id] = m;
    };
    shown.forEach(addMark);
    const refit = () => {
      const vals = Object.values(marks);
      if (vals.length === 1) map.setView(vals[0].getLatLng(), 14);
      else if (vals.length > 1) map.fitBounds(L.featureGroup(vals).getBounds().pad(0.20), { maxZoom:13 });
    };
    refit();
    geocodeMissingFacilities(shown, f => { addMark(f); }, () => { refit(); });

    /* popups are built after render, so delegate rather than bind per button */
    findMapEl.addEventListener("click", e => {
      const btn = e.target.closest("[data-book]");
      if (btn) bookingDialog(Store.getFacility(btn.dataset.book));
    });

    app.querySelectorAll("[data-locate]").forEach(b => b.addEventListener("click", () => {
      const m = marks[b.dataset.locate];
      if (!m) return;
      map.setView(m.getLatLng(), 15);
      m.openPopup();
      findMapEl.scrollIntoView({ block:"nearest", behavior:"smooth" });
    }));
  }

  /* patient: appointments */
  app.querySelectorAll("[data-reschedule]").forEach(b => b.addEventListener("click", () => {
    const a = Store.getAppointment(b.dataset.reschedule);
    bookingDialog(Store.getFacility(a.facilityId), a);
  }));
  app.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", () => {
    const a = Store.getAppointment(b.dataset.cancel), f = Store.getFacility(a.facilityId);
    confirmDialog({ title:"Cancel this appointment?",
      body:(f ? f.name : "The clinic")+" on "+prettyDate(a.date)+" at "+a.time+". The clinic is told straight away.",
      confirmLabel:"Cancel appointment", danger:true,
      onConfirm(){
        const before = a.status;
        Store.updateAppointment(a.id,{ status:"cancelled" });
        render();
        toast("Appointment cancelled.", { restore:() => Store.updateAppointment(a.id,{ status:before }), commit(){} });
      }});
  }));

  /* provider: facility */
  bindForm(app.querySelector("#facForm"), facForm => {
    const r = readFacilityForm(facForm);
    if (!r.ok) return;
    const f = Store.facilityOf(Session.user.id), before = { ...f };
    Store.updateFacility(f.id, r.data);
    render();
    toast("Facility details saved.", { restore:() => Store.updateFacility(f.id, before), commit(){} });
  });
  app.querySelector("#facReset")?.addEventListener("click", () => render());
  if (app.querySelector("#facForm")){
    wirePinMap(app.querySelector("#facForm"), "facMap", "");
    wireServicePrices(app.querySelector("#facForm"));
  }

  /* provider: requests */
  app.querySelectorAll("[data-confirm]").forEach(b => b.addEventListener("click", () => {
    const a = Store.getAppointment(b.dataset.confirm);
    Store.updateAppointment(a.id,{ status:"confirmed", seenByPatient:false });
    render();
    toast("Confirmed for "+a.patientName+".",
      { restore:() => Store.updateAppointment(a.id,{ status:"requested" }), commit(){} });
  }));
  app.querySelectorAll("[data-decline]").forEach(b => b.addEventListener("click", () => {
    const a = Store.getAppointment(b.dataset.decline), before = a.status;
    confirmDialog({
      title: before === "requested" ? "Decline this request?" : "Cancel this booking?",
      body: a.patientName+" on "+prettyDate(a.date)+" at "+a.time+". They will see the change in their appointments.",
      confirmLabel: before === "requested" ? "Decline" : "Cancel booking", danger:true,
      onConfirm(){
        Store.updateAppointment(a.id,{ status: before === "requested" ? "declined" : "cancelled", seenByPatient:false });
        render();
        toast("Patient notified.", { restore:() => Store.updateAppointment(a.id,{ status:before }), commit(){} });
      }});
  }));
  app.querySelectorAll("[data-checkin]").forEach(b => b.addEventListener("click", () => {
    const a = Store.getAppointment(b.dataset.checkin);
    Store.updateAppointment(a.id,{ status:"checked-in", seenByPatient:false });
    render(); toast(a.patientName+" checked in.", { restore:() => Store.updateAppointment(a.id,{ status:"confirmed" }), commit(){} });
  }));
  app.querySelectorAll("[data-startvisit]").forEach(b => b.addEventListener("click", () => {
    const a = Store.getAppointment(b.dataset.startvisit);
    Store.updateAppointment(a.id,{ status:"in-progress", seenByPatient:false });
    render(); toast("Consultation started.", { restore:() => Store.updateAppointment(a.id,{ status:"checked-in" }), commit(){} });
  }));
  app.querySelectorAll("[data-noshow]").forEach(b => b.addEventListener("click", () => {
    const a = Store.getAppointment(b.dataset.noshow);
    Store.updateAppointment(a.id,{ status:"no-show", seenByPatient:false });
    render(); toast("Marked as no show.", { restore:() => Store.updateAppointment(a.id,{ status:"confirmed" }), commit(){} });
  }));
  app.querySelectorAll("[data-complete]").forEach(b => b.addEventListener("click", () => {
    const a = Store.getAppointment(b.dataset.complete);
    Store.updateAppointment(a.id,{ status:"completed", seenByPatient:false });
    render();
    toast("Check-up completed.", { restore:() => Store.updateAppointment(a.id,{ status:"in-progress" }), commit(){} });
  }));

  /* filters shared by provider + admin */
  app.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
    if (route === "/requests") filters.requests = b.dataset.filter;
    if (route === "/directory") filters.directory = b.dataset.filter;
    render();
  }));

  /* admin: directory */
  app.querySelector("#addFac")?.addEventListener("click", () => facilityDialog(null));
  app.querySelectorAll("[data-editfac]").forEach(b =>
    b.addEventListener("click", () => facilityDialog(Store.getFacility(b.dataset.editfac))));
  app.querySelectorAll("[data-approve]").forEach(b => b.addEventListener("click", () => {
    const f = Store.getFacility(b.dataset.approve), before = f.status;
    Store.updateFacility(f.id,{ status:"approved" });
    Store.usersForFacility(f.id).filter(u => u.staffStatus === "pending" && u.id === f.ownerId)
      .forEach(u => Store.updateUser(u.id,{staffStatus:"approved"}));
    render();
    toast(f.name+" approved. It is in search now, and its registering administrator can log in.",
      { restore:() => Store.updateFacility(f.id,{ status:before }), commit(){} });
  }));
  app.querySelectorAll("[data-suspend]").forEach(b => b.addEventListener("click", () => {
    const f = Store.getFacility(b.dataset.suspend);
    Store.updateFacility(f.id,{ status:"suspended" });
    render();
    toast(f.name+" suspended. Hidden from search, and its login is closed.",
      { restore:() => Store.updateFacility(f.id,{ status:"approved" }), commit(){} });
  }));
  app.querySelectorAll("[data-delfac]").forEach(b => b.addEventListener("click", () => {
    const f = Store.getFacility(b.dataset.delfac), n = Store.apptsForFacility(f.id).length;
    confirmDialog({ title:"Delete "+f.name+"?",
      body: n ? "This facility has "+n+" booking"+(n===1?"":"s")+" attached. Deleting it removes the listing from the directory."
              : "This removes the listing from the directory.",
      confirmLabel:"Delete facility", danger:true,
      onConfirm(){
        const removed = Store.deleteFacility(f.id);
        render();
        toast(removed.name+" deleted.", { restore:() => Store.restoreFacility(removed), commit:() => Store.commitDeleteFacility(removed.id) });
      }});
  }));

  /* admin: accounts */
  app.querySelectorAll("[data-edituser]").forEach(b => b.addEventListener("click", () => {
    const u = Store.getUserById(b.dataset.edituser);
    if (u) accountDialog(u);
  }));
  app.querySelectorAll("[data-approveuser]").forEach(b => b.addEventListener("click", () => {
    const u = Store.getUserById(b.dataset.approveuser);
    if (!u) return;
    Store.updateUser(u.id,{staffStatus:"approved"});
    render(); toast(u.displayName+" approved for provider access.");
  }));
  app.querySelectorAll("[data-suspenduser]").forEach(b => b.addEventListener("click", () => {
    const u = Store.getUserById(b.dataset.suspenduser);
    if (!u) return;
    Store.updateUser(u.id,{staffStatus:"suspended"});
    render(); toast(u.displayName+" provider access suspended.");
  }));

  app.querySelectorAll("[data-deluser]").forEach(b => b.addEventListener("click", () => {
    const u = Store.allUsers().find(x => x.id === b.dataset.deluser);
    confirmDialog({ title:"Delete this account?",
      body: u.displayName+" ("+showPhone(u.identifier)+"). They will not be able to log in.",
      confirmLabel:"Delete account", danger:true,
      onConfirm(){
        const removed = Store.deleteUser(u.id);
        render();
        toast(removed.displayName+" deleted.", { restore:() => Store.restoreUser(removed), commit:() => Store.commitDeleteUser(removed.id) });
      }});
  }));
}

/* ---------- start-up ---------- */
async function boot(){
  render();                                           // loading screen
  if (!sb) return;
  try {
    const { data } = await sb.auth.getSession();
    await Store.loadFacilities();
    if (data.session){
      const u = await Store.loadMine(data.session.user.id);
      const f = u && u.role === "provider" ? Store.facilityOf(u.id) : null;
      const blocked = !u || (u.role === "provider" && (!f || u.staffStatus !== "approved" || f.status !== "approved"));
      if (blocked){ await sb.auth.signOut(); Store.clearPrivate(); }
      else Session.signIn(u);
    }
  } catch(e){
    logErr(e); Store.state.offline = true;
    toast("Can't reach Tlhokomelo's server right now. Showing what could be loaded.");
  }
  Store.state.ready = true;
  render();

  /* keep bookings fresh: when the tab comes back into view, and every 30 s */
  const quiet = () => dlg.open || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
  const refresh = async () => {
    if (!Session.user || document.hidden || quiet()) return;
    const before = Store.snapshot();
    await Store.reload();
    if (!quiet() && Store.snapshot() !== before) render();
  };
  setInterval(refresh, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  sb.auth.onAuthStateChange(ev => {
    if (ev === "SIGNED_OUT" && Session.user){ Session.signOut(); Store.clearPrivate(); go("/login"); }
  });
}
boot();
</script>
</body>
</html>
